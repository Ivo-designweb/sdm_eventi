<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.0">
<title>SDM Eventi - Anteprima ultima connessione</title>
<style>
:root{--primario:#1d4ed8;--bg:#f4f6fa;--card:#fff;--testo:#1c2333;--sec:#5b6578;--bordo:#dde2ec;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--blu:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#cfd5e1;color:var(--testo)}
button{font:inherit}
.demo{background:#111827;color:#e5e7eb;padding:8px 14px;font-size:13px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:50}
.demo button{background:#1f2937;color:#fff;border:1px solid #374151;border-radius:6px;padding:4px 10px;cursor:pointer;min-height:30px}
.demo button.on{background:#2563eb;border-color:#2563eb}.demo span{opacity:.75}
.vista{background:var(--bg);margin:0 auto;max-width:900px;min-height:calc(100vh - 44px);padding:18px}
.phone .conn{font-size:11px}
.vista.phone{max-width:390px;padding:12px;box-shadow:0 0 0 1px #b8c0d0}
.sec{color:var(--sec);font-size:14px}
.note2{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bordo);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
/* lista persone */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bordo);cursor:pointer}
.row:last-child{border:0}
.row .info{flex:1;min-width:200px}
.nome{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;background:#9ca3af}
.dot.v{background:#16a34a}
.dot.live{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulsa 1.8s infinite}
@keyframes pulsa{70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.conn{font-size:12px;margin-top:1px;white-space:nowrap}
.conn.mai{color:var(--sec)}.conn.blu{color:var(--blu)}.conn.verde{color:var(--ok)}
.badge{font-size:11px;border-radius:99px;padding:1px 8px;background:#eef2ff;color:var(--primario);font-weight:600;white-space:nowrap}
.badge.ok{background:#dcfce7;color:var(--ok)}.badge.w{background:#fef3c7;color:var(--warn)}
.az{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--primario);color:var(--primario);border-radius:8px;padding:4px 10px;min-height:32px;background:none}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--sec);margin:0 0 8px}
.leg span{display:inline-flex;align-items:center;gap:5px}
/* home per persona */
.seg{display:flex;background:#e8ecf4;border-radius:10px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--sec)}
.seg button.on{background:#fff;color:var(--primario);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gh{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--bordo)}
.gh .nm{flex:1.7;min-width:0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .nm .dot{width:10px;height:10px}
.gh .nm .vuoto{display:inline-block;width:10px;height:10px;flex:none}
.gh .bar{flex:1;display:flex;height:7px;border-radius:99px;overflow:hidden;background:#dbe1ec;min-width:50px}
.gh .bar i{display:block;height:100%}
.gh .fr{font-size:12px;color:var(--sec);width:34px;text-align:right}
.gh .ar{color:var(--sec);width:14px;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="demo"><b>Anteprima: ultima connessione</b>
  <span>Pagina:</span><button id="pL" class="on">Persone (amministratore)</button><button id="pH">Home «Per persona»</button>
  <span>Formato:</span><button id="vPc" class="on">PC</button><button id="vPh">Smartphone</button>
  <span>Ruolo:</span><button id="rA" class="on">Amministratore</button><button id="rR">Responsabile</button></div>

<div class="vista" id="vista">
  <!-- PERSONE -->
  <div id="paginaL">
    <div class="card">
      <h2>Persone</h2>
      <div id="lista"></div>
    </div>
  </div>
  <!-- HOME -->
  <div id="paginaH" class="hidden">
    <div class="card">
      <div class="seg"><button class="on">Per persona</button><button>Per ramo</button></div>
      <div id="gruppi"></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
// ultima connessione finta: null = mai; online = presenza in tempo reale
const P=[
 {n:'Bianchi Marco',mail:'marco.bianchi@example.it',tel:'333 1112233',isc:'iscritto 0412',resp:'Logistica',conn:'05/11/2026 10:28',online:true,f:[5,2,1]},
 {n:'Rossi Anna',mail:'anna.rossi@example.it',tel:'333 4445566',isc:'iscritto 0188',admin:true,conn:'05/11/2026 09:52',online:false,f:[3,1,2]},
 {n:'Verdi Luca',mail:'luca.verdi@example.it',tel:'',isc:'non iscritto',conn:'03/11/2026 18:07',online:false,f:[1,3,0]},
 {n:'Neri Giulia',mail:'giulia.neri@example.it',tel:'339 7778899',isc:'non iscritto',conn:null,online:false,f:[0,0,4]}
];
function conn(p){
  const c=p.online?'verde':(p.conn?'blu':'mai');
  return `<div class="conn ${c}">Connesso: ${p.conn||'—'}</div>`;
}
function dot(p){return `<i class="dot ${p.conn?(p.online?'live':'v'):''}" ></i>`}
function lista(){
  $('#lista').innerHTML=P.map(p=>`<div class="row"><div class="info"><span class="nome">${p.n} ${dot(p)}</span>
   <div class="sec">${p.mail}${p.tel?' · '+p.tel:''}</div>${conn(p)}</div>
   <div class="az"><span class="badge ${p.isc.startsWith('iscr')?'ok':''}">${p.isc}</span>${p.admin?'<span class="badge w">admin</span>':''}${p.resp?'<span class="badge">👤 '+p.resp+'</span>':''}
   ${p.tel?'<button class="btn">📞</button><button class="btn">💬</button>':''}<button class="btn">✉️</button></div></div>`).join('');
}
function home(){
  $('#gruppi').innerHTML=P.map(p=>{const t=p.f[0]+p.f[1]+p.f[2],w=x=>100*x/t;
   return `<div class="gh"><span class="nm">${p.conn?'<i class="dot v"></i>':'<i class="vuoto"></i>'}${p.n}</span>
   <span class="bar"><i style="width:${w(p.f[0])}%;background:#15803d"></i><i style="width:${w(p.f[1])}%;background:#60a5fa"></i></span>
   <span class="fr">${p.f[0]}/${t}</span><span class="ar">▸</span></div>`}).join('');
}
function pagina(l){
  $('#pL').classList.toggle('on',l);$('#pH').classList.toggle('on',!l);
  $('#paginaL').classList.toggle('hidden',!l);$('#paginaH').classList.toggle('hidden',l);
  $('#rA').disabled=$('#rR').disabled=l;$('#rA').style.opacity=$('#rR').style.opacity=l?.4:1;
}
$('#pL').onclick=()=>pagina(true);$('#pH').onclick=()=>{pagina(false);home()};
$('#vPc').onclick=()=>{$('#vista').classList.remove('phone');$('#vPc').classList.add('on');$('#vPh').classList.remove('on')};
$('#vPh').onclick=()=>{$('#vista').classList.add('phone');$('#vPh').classList.add('on');$('#vPc').classList.remove('on')};
$('#rA').onclick=()=>{$('#rA').classList.add('on');$('#rR').classList.remove('on');home()};
$('#rR').onclick=()=>{$('#rR').classList.add('on');$('#rA').classList.remove('on');home()};
lista();home();
</script>
</body>
</html>
